<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#f2e8d5" />
  <title>交互式汉字</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-scene="loading">
  <!-- 背景：宣纸、远山、飞鸟。slice 铺满整屏 -->
  <svg id="backdrop" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <defs>
      <filter id="paper" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="5" result="grain" />
        <feColorMatrix in="grain" type="matrix" values="0 0 0 0 .42  0 0 0 0 .33  0 0 0 0 .2  0 0 0 .22 0" result="g" />
        <feTurbulence type="fractalNoise" baseFrequency="0.003 0.06" numOctaves="2" seed="9" result="fiber" />
        <feColorMatrix in="fiber" type="matrix" values="0 0 0 0 .5  0 0 0 0 .4  0 0 0 0 .28  0 0 0 .16 0" result="f" />
        <feMerge><feMergeNode in="f" /><feMergeNode in="g" /></feMerge>
      </filter>
      <filter id="mist-wash" x="-5%" y="-20%" width="110%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.008 0.02" numOctaves="4" seed="11" />
        <feDisplacementMap in="SourceGraphic" scale="40" xChannelSelector="R" yChannelSelector="G" />
        <feGaussianBlur stdDeviation="2.5" />
      </filter>
      <linearGradient id="far-fade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#7d8f97" stop-opacity=".42" />
        <stop offset=".55" stop-color="#7d8f97" stop-opacity="0" />
      </linearGradient>
      <linearGradient id="near-fade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#3f4b50" stop-opacity=".5" />
        <stop offset=".7" stop-color="#3f4b50" stop-opacity="0" />
      </linearGradient>
    </defs>
    <rect width="1600" height="1000" fill="#f2e8d5" />
    <rect width="1600" height="1000" filter="url(#paper)" />
    <g filter="url(#mist-wash)">
      <path fill="url(#far-fade)" d="M0 720 C120 640 200 610 300 650 C380 600 460 520 560 600 C640 660 700 640 780 600 C860 560 920 500 1010 580 C1090 650 1160 620 1240 590 C1330 550 1420 600 1500 640 C1560 660 1600 650 1600 650 L1600 1000 L0 1000Z" />
      <path fill="url(#near-fade)" d="M0 830 C100 770 180 750 260 800 C330 840 400 770 470 740 C540 710 600 770 660 810 C760 870 860 800 940 770 C1020 740 1100 810 1180 830 C1280 855 1360 780 1440 770 C1520 760 1570 800 1600 810 L1600 1000 L0 1000Z" />
    </g>
    <g id="scenery"></g>
    <g class="birds" stroke="#2b2724" stroke-width="3" fill="none" stroke-linecap="round">
      <path class="bird b1" d="M0 0 q9 -8 18 0 q9 -8 18 0" />
      <path class="bird b2" d="M0 0 q7 -6 14 0 q7 -6 14 0" />
      <path class="bird b3" d="M0 0 q6 -5 12 0 q6 -5 12 0" />
    </g>
  </svg>

  <!-- 舞台：1024 见方，与笔画数据同一坐标系 -->
  <svg id="stage" viewBox="0 0 1024 1024" preserveAspectRatio="xMidYMid meet">
    <defs>
      <filter id="ink" x="-15%" y="-15%" width="130%" height="130%">
        <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="3" result="n" />
        <feDisplacementMap in="SourceGraphic" in2="n" scale="8" xChannelSelector="R" yChannelSelector="G" result="d" />
        <feGaussianBlur in="d" stdDeviation="5" result="bleed" />
        <feComponentTransfer in="bleed" result="halo"><feFuncA type="linear" slope=".38" /></feComponentTransfer>
        <feGaussianBlur in="d" stdDeviation=".7" result="core" />
        <feMerge><feMergeNode in="halo" /><feMergeNode in="core" /></feMerge>
      </filter>
      <filter id="wash1" x="-40%" y="-40%" width="180%" height="180%">
        <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="4" seed="7" />
        <feDisplacementMap in="SourceGraphic" scale="60" xChannelSelector="R" yChannelSelector="B" />
        <feGaussianBlur stdDeviation="3" />
      </filter>
      <filter id="wash2" x="-40%" y="-40%" width="180%" height="180%">
        <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="21" />
        <feDisplacementMap in="SourceGraphic" scale="45" xChannelSelector="G" yChannelSelector="R" />
        <feGaussianBlur stdDeviation="6" />
      </filter>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="40" />
      </filter>
      <radialGradient id="sun-core" cx=".45" cy=".42" r=".6">
        <stop offset="0" stop-color="#f08a4b" />
        <stop offset=".65" stop-color="#e05a33" />
        <stop offset="1" stop-color="#c8402a" />
      </radialGradient>
    </defs>

    <g id="picture-layer"></g>
    <g id="grid-layer"></g>
    <g id="ghost-layer"></g>
    <g id="morph-layer" filter="url(#ink)"></g>
    <g id="kaishu-layer" filter="url(#ink)"></g>
    <g id="trace-layer" filter="url(#ink)"></g>
    <g id="hint-layer"></g>
    <g id="stamp-layer"></g>
  </svg>

  <main id="home" aria-label="选一个字">
    <h1 class="title">交互式汉字</h1>
    <div class="shelf"></div>
    <div class="soon-row"></div>
  </main>

  <button id="start" data-testid="start" aria-label="开始">
    <span class="seed"></span>
    <span class="start-text">点一下，开始</span>
  </button>

  <nav id="controls" aria-label="控制">
    <button id="btn-home" data-testid="btn-home" aria-label="回到首页">
      <svg viewBox="0 0 48 48"><path d="M7 23L24 9l17 14" /><path d="M12 19v20h24V19" /><path d="M20 39V28h8v11" /></svg>
    </button>
    <button id="btn-sound" data-testid="btn-sound" aria-label="听读音">
      <svg viewBox="0 0 48 48"><path d="M8 19h8l10-8v26l-10-8H8z" /><path d="M32 17c3 4 3 10 0 14M37 12c6 7 6 17 0 24" /></svg>
    </button>
    <button id="btn-replay" data-testid="btn-replay" aria-label="再看一遍">
      <svg viewBox="0 0 48 48"><path d="M38 24a14 14 0 1 1-5-10.7" /><path d="M34 6v8h-8" /></svg>
    </button>
    <button id="btn-write" data-testid="btn-write" aria-label="写一写">
      <svg viewBox="0 0 48 48"><path d="M33 7l8 8-20 20-10 2 2-10z" /><path d="M8 42c8-3 16 1 32-2" /></svg>
    </button>
  </nav>

  <script type="module" src="src/app.js"></script>
</body>
</html>
